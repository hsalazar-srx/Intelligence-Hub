name: 📺 YouTube Signal Tracker

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 08:00 UTC
  workflow_dispatch:        # Manual trigger from Actions tab

permissions:
  contents: write           # Needed to commit state file + create PR branch
  pull-requests: write      # Needed to open PRs
  id-token: write

jobs:
  track-youtube:
    name: 🔍 Fetch & Filter New Videos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml requests youtube-transcript-api anthropic

      - name: Run YouTube tracker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/youtube_tracker.py

      - name: Summary
        run: echo "✅ YouTube tracker run complete. Check Pull Requests tab for new signals."
