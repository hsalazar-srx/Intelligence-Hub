name: 🔍 Scan, Build & Deploy IT Strategy Intelligence Hub

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  security-scan:
    name: 🛡️ Sensitive Data Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan for private IPs
        run: |
          FOUND=$(grep -rE '\b(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)[0-9]{1,3}\.[0-9]{1,3}\b' \
            --include="*.md" --include="*.yml" --include="*.json" --exclude-dir=".git" . || true)
          if [ -n "$FOUND" ]; then echo "❌ Private IPs: $FOUND"; exit 1; fi
          echo "✅ No private IPs"

      - name: Scan for DB connection strings
        run: |
          FOUND=$(grep -rE '(jdbc:|mongodb://|redis://|Server=.*Database=|postgresql://)' \
            --include="*.md" --include="*.yml" --include="*.json" --exclude-dir=".git" . || true)
          if [ -n "$FOUND" ]; then echo "❌ DB strings: $FOUND"; exit 1; fi
          echo "✅ No DB strings"

      - name: Check for .env files
        run: |
          if find . -name ".env*" -not -path "./.git/*" | grep -q .; then
            echo "❌ .env files found"; exit 1
          fi
          echo "✅ No .env files"

  build:
    name: 🏗️ Build Intelligence Hub
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build site
        run: python3 scripts/build.py

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    name: 🚀 Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
