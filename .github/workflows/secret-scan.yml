name: 🔒 Secret & Sensitive Data Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  scan:
    name: Scan for sensitive data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate diff scanning

      - name: Run Gitleaks (credential scanner)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Gitleaks scans for 150+ secret patterns: API keys, tokens, certs, etc.

      - name: Custom pattern scan (org-specific)
        run: |
          echo "🔍 Running custom pattern scan..."
          FAILED=0

          # Internal IP ranges
          if grep -rE "192\.168\.[0-9]+\.[0-9]+|10\.[0-9]+\.[0-9]+\.[0-9]+" \
            --include="*.md" --include="*.yml" --include="*.json" \
            --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "❌ Internal IP addresses found"
            FAILED=1
          fi

          # Database connection strings
          if grep -rE "jdbc:[a-z]+://|mongodb(\+srv)?://|Server=[^;]+;Database=" \
            --include="*.md" --include="*.yml" --include="*.json" \
            --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "❌ Database connection string found"
            FAILED=1
          fi

          # ERP-specific patterns
          if grep -rE "M3[_-]?(USER|PASS|HOST|PORT)\s*[:=]|MOVEX[_-]?(USER|PASS)" \
            --include="*.md" --include="*.yml" --include="*.json" \
            --exclude-dir=".git" --exclude-dir=".github" .; then
            echo "❌ ERP credential pattern found"
            FAILED=1
          fi

          if [ $FAILED -eq 1 ]; then
            echo "🚫 Scan failed. Remove sensitive data before merging."
            exit 1
          fi

          echo "✅ Custom scan passed."
