# Add new channels here — no code changes needed.
# The tracker picks them up automatically on next Monday run.
#
# Fields:
#   name:         Display name (used in signal metadata)
#   channel_id:   From the channel URL: youtube.com/channel/CHANNEL_ID
#                 Or use: youtube.com/@handle → view source → search "channelId"
#   project_hint: Default project tag (Claude may override based on content)
#                 Options: ai-platform | digital-transformation | m3-erp-integration | general
#   priority:     high | medium | low (affects processing order, not filtering)
#   notes:        Why this channel is in the list (for future team members)
#
# Verification status legend:
#   ✅ VERIFIED   — channel_id confirmed via Wikidata, NoxInfluencer, Playboard, or SocialBlade
#   ⚠️ UNVERIFIED — channel_id not independently confirmed; validate by visiting
#                  youtube.com/@handle → right-click → View Page Source → Ctrl+F "channelId"
# ─────────────────────────────────────────────────────────────────

